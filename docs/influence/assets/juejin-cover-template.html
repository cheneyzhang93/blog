<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!--
  掘金封面模板（1200×630）· 与站点 og:image 同源视觉。
  产出单篇封面：改 .label（系列名）与 h1（文章标题，≤14 字/行、最多两行），重新截图即可：

  "C:/Program Files/Google/Chrome/Application/chrome.exe" --headless=new --hide-scrollbars \
    --window-size=1200,630 --force-device-scale-factor=1 \
    --screenshot=docs/influence/assets/juejin-cover-template.png \
    "file:///D:/code/blog/docs/influence/assets/juejin-cover-template.html"
-->
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  .cover {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background:
      radial-gradient(900px 600px at 18% 12%, rgba(122, 162, 247, .10), transparent 60%),
      radial-gradient(700px 500px at 85% 92%, rgba(122, 162, 247, .05), transparent 60%),
      #1b1d21;
    color: #e8eaed;
    font-family: "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, .022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, .022) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .left { position: absolute; left: 88px; top: 148px; width: 700px; }
  .label { color: #7aa2f7; font-size: 30px; font-weight: 600; letter-spacing: 1px; }
  h1 {
    margin: 26px 0 0; font-size: 62px; line-height: 1.2; font-weight: 700; letter-spacing: 1px;
  }
  .rule { width: 150px; height: 6px; border-radius: 3px; background: #7aa2f7; margin: 36px 0 30px; }
  .sub { color: #9aa0a6; font-size: 28px; letter-spacing: .5px; }
  .url {
    position: absolute; left: 88px; bottom: 62px;
    color: #8b9096; font-size: 26px; letter-spacing: .5px;
  }
  .avatar {
    position: absolute; right: 92px; top: 50%; transform: translateY(-50%);
    width: 280px; height: 280px; border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 0 2px #3a3d42, 0 18px 50px rgba(0, 0, 0, .5);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
  <div class="cover">
    <div class="grid"></div>
    <div class="left">
      <div class="label">稳定性治理 · 系列</div>
      <h1>文章标题占位，最多两行</h1>
      <div class="rule"></div>
      <div class="sub">系统的从 0 到 1：设计、取舍与实测复盘</div>
    </div>
    <div class="avatar"><img src="../../../assets/images/avatar.jpg" alt=""></div>
    <div class="url">cheneyzhang93.github.io/blog</div>
  </div>
</body>
</html>
